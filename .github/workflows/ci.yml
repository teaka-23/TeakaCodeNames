name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check backend
        run: |
          cd backend
          npx tsc --noEmit

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run backend tests
        run: |
          cd backend
          npx jest --ci --coverage --silent

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test -- --run --coverage

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm run build
