# Render Blueprint — Codenames IT Edition
# Dashboard: https://dashboard.render.com/ → New → Blueprint
#
# Actual public URLs (Render added suffixes):
#   API:  https://codenames-api-agv9.onrender.com
#   Web:  https://codenames-web-erca.onrender.com

services:
  # ── Backend (Express + WebSocket) ──────────────────────────────
  - type: web
    name: codenames-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev: tsc lives in devDependencies; NODE_ENV=production
    # would otherwise make `npm ci` omit it and break the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Soft persistence for crash recovery while the instance is awake.
      # Free tier has no durable disk — /tmp is wiped on sleep/redeploy.
      # For paid + disk: PERSISTENCE_FILE=/data/rooms.json
      - key: PERSISTENCE_DRIVER
        value: file
      - key: PERSISTENCE_FILE
        value: /tmp/codenames-rooms.json
      # Keep empty rooms ~10 min so brief disconnects don't wipe the match.
      - key: EMPTY_ROOM_GRACE_MS
        value: "600000"
      - key: CORS_ORIGINS
        value: https://codenames-web-erca.onrender.com

  # ── Frontend (Vite static SPA) ─────────────────────────────────
  - type: web
    name: codenames-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Baked into the SPA at build time — must match the live API URL
      - key: VITE_BACKEND_URL
        value: https://codenames-api-agv9.onrender.com
